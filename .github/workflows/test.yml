name: Test formulae

# Builds and tests waxon from source on macOS and Linux, with the same style and
# audit checks homebrew-core runs, so a broken formula is caught before users hit it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  waxon:
    name: waxon (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Sets up Homebrew and taps this repository as danfry1/tap at the commit under test.
      - uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1

      - name: Trust this tap
        run: brew trust danfry1/tap

      - name: Style
        run: brew style danfry1/tap/waxon

      - name: Audit
        run: brew audit --strict --online --formula danfry1/tap/waxon

      - name: Build from source
        run: brew install --build-from-source --formula danfry1/tap/waxon

      - name: Test
        run: brew test danfry1/tap/waxon
